[package]
name = "cloudish"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cloudish"
path = "src/main.rs"

[lib]
name = "cloudish"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "normalize-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio-postgres = "0.7"
quick-xml = { version = "0.37", features = ["serialize"] }
md-5 = "0.10"
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
bcrypt = "0.15"

[dev-dependencies]
tokio-test = "0.4"
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-cognitoidentityprovider = "1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
